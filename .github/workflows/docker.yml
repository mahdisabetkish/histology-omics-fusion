# Builds the CPU and GPU images, smoke-tests them, and publishes to Docker Hub.
#
#   push to main    ->  :latest  :cpu  :gpu  :sha-<short>-cpu  :sha-<short>-gpu
#   tag v1.2.3      ->  :1.2.3-cpu  :1.2-cpu  :1.2.3-gpu  :1.2-gpu  (+ sha tags)
#   pull request    ->  built and tested, never pushed
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  your Docker Hub username
#   DOCKERHUB_TOKEN     a Docker Hub access token with Read & Write scope
#                       (Read, Write & Delete to also sync the Hub description)

name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "slurm/**"
      - "**.md"
      - "CITATION.cff"
      - "LICENSE"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: docker.io/mahdisabetkish/histology-omics-fusion

jobs:
  image:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            torch: cpu
          - variant: gpu
            torch: cu126

    steps:
      # The CUDA wheels alone are several gigabytes, and the image has to exist
      # twice over while it is loaded for testing. The stock runner is short on
      # space for that.
      - name: Free disk space
        if: matrix.variant == 'gpu'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af
          df -h /

      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
            suffix=-${{ matrix.variant }}
          tags: |
            type=raw,value=${{ matrix.variant }},suffix=,enable={{is_default_branch}}
            type=raw,value=latest,suffix=,enable=${{ matrix.variant == 'cpu' && github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=ref,event=pr

      - name: Build for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: TORCH_VARIANT=${{ matrix.torch }}
          load: true
          tags: hof:test
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max

      # --network none proves the ImageNet weights are baked in.
      - name: Smoke test
        run: |
          docker run --rm hof:test info
          docker run --rm --network none \
            -v "$PWD/docker/smoke_test.py:/tmp/smoke_test.py:ro" \
            hof:test python /tmp/smoke_test.py
          docker image ls hof:test

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Same inputs as the test build, so every layer comes from cache; this
      # step only adds the attestations and uploads.
      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            TORCH_VARIANT=${{ matrix.torch }}
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.variant }}

  hub-description:
    name: Docker Hub description
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: mahdisabetkish/histology-omics-fusion
          short-description: Spatial transcriptomics + H&E histology fusion for cortical layer prediction. CPU & CUDA.
          readme-filepath: docker/README.hub.md
          enable-url-completion: true
